<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style>
<!-- Needs three.module.js (+ three.core.js for recent versions) next to this file: npm pack three, or copy from node_modules/three/build -->
<script type="importmap">{"imports":{"three":"./three.module.js"}}</script></head><body><canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
const W = 540, H = 960;
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
r.setSize(W, H, false); r.shadowMap.enabled = true; r.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x14101f);
const cam = new THREE.PerspectiveCamera(44, W / H, 0.1, 50);
// geometry: floor, a desk box, a glowing "screen"
const mat = (c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.8 });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), mat(0x2a2540)); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const desk = new THREE.Mesh(new THREE.BoxGeometry(2, 0.1, 1), mat(0x6b4a35)); desk.position.y = 0.8; desk.castShadow = desk.receiveShadow = true; scene.add(desk);
const screen = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.5, 0.04), new THREE.MeshBasicMaterial({ color: new THREE.Color(0.3, 1.2, 1.4) }));
screen.position.set(0, 1.15, -0.2); scene.add(screen);
const key = new THREE.SpotLight(0xffa24d, 60, 12, 0.6, 0.5); key.position.set(-3, 3, 2); key.castShadow = true; key.shadow.normalBias = 0.04; scene.add(key);
scene.add(new THREE.HemisphereLight(0x8a86b0, 0x14101f, 0.5));
// camera path: 3 key points through a centripetal Catmull-Rom curve
const P = new THREE.CatmullRomCurve3([[-3, 2.2, 4], [-1.2, 1.5, 2.4], [0, 1.25, 2.1]].map(a => new THREE.Vector3(...a)), false, 'centripetal');
const T = new THREE.CatmullRomCurve3([[0, 0.9, 0], [0, 1.0, -0.1], [0, 1.15, -0.2]].map(a => new THREE.Vector3(...a)), false, 'centripetal');
const ease = (x) => { const c = x < .5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2; const s = x * x * (3 - 2 * x); return 0.5 * c + 0.5 * s; };
const DUR = 9;
// a frame is a pure function of time
window.render = (t) => {
  const u = ease(Math.min(1, Math.max(0, t / DUR)));
  cam.position.copy(P.getPoint(u)); cam.lookAt(T.getPoint(u));
  const sh = 0.003; cam.position.x += sh * Math.sin(t * 1.3); cam.position.y += sh * Math.sin(t * 2.1 + 1);  // handheld, no random()
  r.render(scene, cam); return r.domElement.toDataURL('image/png').slice(22);
};
window.ready = true;
</script></body></html>
