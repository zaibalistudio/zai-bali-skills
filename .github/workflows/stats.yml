name: Update README stats

on:
  schedule:
    - cron: "17 3 * * *" # daily, UTC
  workflow_dispatch:

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update stats block in README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          read -r stars forks pushed < <(gh api "repos/$REPO" --jq '[.stargazers_count, .forks_count, .pushed_at] | @tsv')
          # commit count from the API's Link header (per_page=1 -> last page number == total)
          commits=$(gh api -i "repos/$REPO/commits?per_page=1" | tr -d '\r' | awk -F'[=>&]' 'tolower($1) ~ /^link:/ {for(i=1;i<=NF;i++) if($i=="page" && $(i-1) ~ /per_page|\?/ ) last=$(i+1)} END{print last}')
          if [ -z "${commits:-}" ]; then
            commits=$(gh api "repos/$REPO/commits?per_page=1" --jq 'length')
          fi
          skills=$(find skills -mindepth 1 -maxdepth 1 -type d | wc -l)
          updated=$(date -u -d "$pushed" +%Y-%m-%d)

          block="<!-- STATS:START -->
          ⭐ Stars: **$stars** · 🍴 Forks: **$forks** · 🧩 Skills: **$skills** · 📝 Commits: **$commits** · 🕒 Last updated: **$updated** (UTC)
          <!-- STATS:END -->"
          block=$(printf '%s\n' "$block" | sed 's/^          //')

          grep -q '<!-- STATS:START -->' README.md && grep -q '<!-- STATS:END -->' README.md || { echo "markers missing"; exit 1; }
          BLOCK="$block" python3 - <<'PY'
          import os, re
          p = "README.md"
          s = open(p, encoding="utf-8").read()
          new = re.sub(r"<!-- STATS:START -->.*?<!-- STATS:END -->", lambda m: os.environ["BLOCK"], s, count=1, flags=re.S)
          open(p, "w", encoding="utf-8").write(new)
          PY

      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "No changes in stats."
            exit 0
          fi
          git config user.name "Z.AI BALI Studio"
          git config user.email "studio@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update README stats"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
